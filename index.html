<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Toko Puspa - POS</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="manifest" href="manifest.json">
    <script src="https://unpkg.com/html5-qrcode"></script>
</head>

<body>
    <div class="container">
        <h1>TOKO PUSPA</h1>

        <div class="card">
            <div id="reader"></div>
            <p style="text-align: center; color: var(--text-muted); font-size: 0.9rem; margin-top: 10px;">
                Align barcode within the center of the camera
            </p>
        </div>

        <div id="last-scanned" class="card" style="display: none;">
            <p style="color: var(--text-muted); font-size: 0.8rem; margin-bottom: 5px;">Last Scanned:</p>
            <div class="scanned-item">
                <div>
                    <strong id="last-name">Product Name</strong><br>
                    <span id="last-price" style="color: var(--accent); font-weight: 600;">Rp 0</span>
                </div>
                <div id="last-qty"
                    style="background: var(--primary); padding: 5px 12px; border-radius: 20px; font-size: 0.8rem;">
                    1x
                </div>
            </div>
        </div>

        <div class="manual-input card">
            <p style="margin-bottom: 15px;">Manual Barcode Entry</p>
            <div class="input-group">
                <input type="text" id="barcode-input" placeholder="Enter barcode number...">
                <button class="btn btn-primary" id="add-manual" style="width: auto; margin-top: 0;">Add</button>
            </div>
        </div>

        <a href="cart.html" class="btn btn-success" id="finish-btn">Finish & View Bill</a>
        <a href="products.html" class="btn btn-outline" style="margin-top: 10px;">Manage Products</a>
    </div>

    <div id="notification" class="notification">Item added to cart!</div>

    <script src="assets/js/app.js"></script>
    <script src="assets/js/scanner.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js');
        }
    </script>
</body>

</html>
