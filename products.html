<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Products - Toko Puspa</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <script src="https://unpkg.com/html5-qrcode"></script>
</head>

<body>
    <div class="container">
        <h1>MANAGE PRODUCTS</h1>

        <div class="card" id="add-product-container">
            <p style="margin-bottom: 15px; font-weight: 600;" id="form-title">Scan Barcode to Add</p>

            <!-- Step 1: Scanner Selection -->
            <div id="scanner-step">
                <div id="product-reader"
                    style="width: 100%; border-radius: 12px; overflow: hidden; margin-bottom: 15px;"></div>
                <button class="btn btn-outline" id="input-manual">Input Manual (Skip Scan)</button>
            </div>

            <!-- Step 2: Product Form (Hidden initially) -->
            <div id="form-step" style="display: none; flex-direction: column; gap: 10px;">
                <input type="text" id="new-barcode" placeholder="Barcode Number">
                <input type="text" id="new-name" placeholder="Product Name">
                <div style="display: flex; gap: 10px; flex-wrap: wrap;">
                    <input type="number" id="new-price" placeholder="Price (Rp)" style="flex: 2; min-width: 150px;">
                    <input type="text" id="new-unit" placeholder="Unit (pcs/btl)" style="flex: 1; min-width: 80px;">
                </div>
                <div style="display: flex; gap: 10px;">
                    <button class="btn btn-outline" id="back-to-scan" style="flex: 1;">Back</button>
                    <button class="btn btn-primary" id="save-product" style="flex: 2;">Save Product</button>
                </div>
            </div>
        </div>

        <div class="card">
            <p style="margin-bottom: 15px; font-weight: 600;">Product List</p>
            <div style="max-height: 400px; overflow-y: auto;">
                <table class="cart-table">
                    <thead>
                        <tr>
                            <th>Product</th>
                            <th style="text-align: right;">Action</th>
                        </tr>
                    </thead>
                    <tbody id="product-list-items">
                        <!-- Items injected here -->
                    </tbody>
                </table>
            </div>
        </div>

        <div class="footer-actions">
            <a href="index.html" class="btn btn-outline">Back to Scanner</a>
        </div>
    </div>

    <div id="notification" class="notification">Product saved!</div>

    <script src="assets/js/app.js"></script>
    <script>
        let html5QrcodeScanner = null;

        document.addEventListener('DOMContentLoaded', async () => {
            await initProducts();
            renderProductList();
            startProductScanner();

            document.getElementById('input-manual').addEventListener('click', () => {
                showForm('');
            });

            document.getElementById('back-to-scan').addEventListener('click', () => {
                showScanner();
            });

            document.getElementById('save-product').addEventListener('click', async () => {
                const barcode = document.getElementById('new-barcode').value;
                const name = document.getElementById('new-name').value;
                const price = document.getElementById('new-price').value;
                const unit = document.getElementById('new-unit').value;

                if (!barcode || !name || !price) {
                    alert("Please fill all required fields");
                    return;
                }

                const existingIndex = productDB.findIndex(p => p.barcode === barcode);

                if (existingIndex > -1) {
                    if (confirm("Barcode already exists. Update product?")) {
                        productDB[existingIndex] = { barcode, name, price: parseInt(price), unit };
                    } else {
                        return;
                    }
                } else {
                    productDB.push({ barcode, name, price: parseInt(price), unit });
                }

                await saveProducts(productDB);
                renderProductList();
                showNotification("Product saved!");
                showScanner();
            });
        });

        function showForm(barcode) {
            if (html5QrcodeScanner) {
                html5QrcodeScanner.clear();
            }
            document.getElementById('scanner-step').style.display = 'none';
            document.getElementById('form-step').style.display = 'flex';
            document.getElementById('form-title').innerText = barcode ? 'Fill Product Details' : 'Manual Entry';

            document.getElementById('new-barcode').value = barcode;
            document.getElementById('new-name').value = '';
            document.getElementById('new-price').value = '';
            document.getElementById('new-unit').value = '';
            document.getElementById('new-name').focus();
        }

        function showScanner() {
            document.getElementById('scanner-step').style.display = 'block';
            document.getElementById('form-step').style.display = 'none';
            document.getElementById('form-title').innerText = 'Scan Barcode to Add';
            startProductScanner();
        }

        function startProductScanner() {
            if (html5QrcodeScanner) html5QrcodeScanner.clear();

            html5QrcodeScanner = new Html5QrcodeScanner(
                "product-reader", { fps: 10, qrbox: { width: 250, height: 150 } }
            );

            html5QrcodeScanner.render((decodedText) => {
                showForm(decodedText);
            }, (error) => {
                // Ignore silent scan errors
            });
        }

        function renderProductList() {
            const container = document.getElementById('product-list-items');
            container.innerHTML = '';

            productDB.forEach((p, index) => {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>
                        <div style="font-weight: 600;">${p.name}</div>
                        <div style="font-size: 0.75rem; color: var(--text-muted);">${p.barcode} | ${formatIDR(p.price)}</div>
                    </td>
                    <td style="text-align: right;">
                        <button onclick="deleteProduct(${index})" style="background: none; border: none; color: var(--danger); cursor: pointer; font-size: 0.8rem;">Delete</button>
                    </td>
                `;
                container.appendChild(row);
            });
        }

        async function deleteProduct(index) {
            if (confirm("Are you sure you want to delete this product?")) {
                productDB.splice(index, 1);
                await saveProducts(productDB);
                renderProductList();
                showNotification("Product deleted");
            }
        }
    </script>
</body>

</html>
